services:
  db:
    image: postgres:16-alpine
    container_name: ai-club-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiclub
      POSTGRES_PASSWORD: aiclub
      POSTGRES_DB: aiclub
    ports:
      # Host 5433 avoids clashing with a local Postgres already using 5432.
      - '5433:5432'
    volumes:
      - ai_club_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aiclub -d aiclub']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_club_pgdata:
