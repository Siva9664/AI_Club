<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="neuralGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="1" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.4); opacity: 1; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes driftGrid {
        0% { transform: translate(0, 0); }
        50% { transform: translate(-20px, 15px); }
        100% { transform: translate(0, 0); }
      }
      .node { transform-origin: center; animation: pulseNode 3s ease-in-out infinite alternate; }
      .synapse { stroke-dasharray: 6, 8; animation: dashMove 12s linear infinite; }
      .grid-layer { animation: driftGrid 16s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#050814" />

  <!-- Background Tensor Grid -->
  <g class="grid-layer" opacity="0.25">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800 M0 500 H800" stroke="#3b82f6" stroke-width="0.5" />
    <path d="M100 0 V600 M200 0 V600 M300 0 V600 M400 0 V600 M500 0 V600 M600 0 V600 M700 0 V600" stroke="#3b82f6" stroke-width="0.5" />
  </g>

  <!-- Neural Synapse Connections -->
  <g stroke="url(#neuralGrad1)" stroke-width="1.5" class="synapse">
    <line x1="120" y1="180" x2="280" y2="120" />
    <line x1="120" y1="180" x2="320" y2="280" />
    <line x1="280" y1="120" x2="480" y2="180" />
    <line x1="320" y1="280" x2="480" y2="180" />
    <line x1="320" y1="280" x2="460" y2="380" />
    <line x1="480" y1="180" x2="680" y2="150" />
    <line x1="480" y1="180" x2="660" y2="320" />
    <line x1="460" y1="380" x2="660" y2="320" />
    <line x1="460" y1="380" x2="620" y2="480" />
    <line x1="180" y1="420" x2="320" y2="280" />
    <line x1="180" y1="420" x2="460" y2="380" />
  </g>

  <!-- Pulsing Neural Nodes with Glow Filter -->
  <g filter="url(#glow)">
    <circle cx="120" cy="180" r="16" fill="url(#nodeGlow)" class="node" style="animation-delay: 0s" />
    <circle cx="120" cy="180" r="5" fill="#60a5fa" />

    <circle cx="280" cy="120" r="20" fill="url(#nodeGlow)" class="node" style="animation-delay: 0.4s" />
    <circle cx="280" cy="120" r="7" fill="#93c5fd" />

    <circle cx="320" cy="280" r="24" fill="url(#nodeGlow)" class="node" style="animation-delay: 0.8s" />
    <circle cx="320" cy="280" r="8" fill="#38bdf8" />

    <circle cx="180" cy="420" r="18" fill="url(#nodeGlow)" class="node" style="animation-delay: 1.2s" />
    <circle cx="180" cy="420" r="6" fill="#60a5fa" />

    <circle cx="480" cy="180" r="26" fill="url(#nodeGlow)" class="node" style="animation-delay: 1.6s" />
    <circle cx="480" cy="180" r="9" fill="#00f2fe" />

    <circle cx="460" cy="380" r="22" fill="url(#nodeGlow)" class="node" style="animation-delay: 2.0s" />
    <circle cx="460" cy="380" r="7" fill="#38bdf8" />

    <circle cx="680" cy="150" r="18" fill="url(#nodeGlow)" class="node" style="animation-delay: 2.4s" />
    <circle cx="680" cy="150" r="6" fill="#93c5fd" />

    <circle cx="660" cy="320" r="24" fill="url(#nodeGlow)" class="node" style="animation-delay: 2.8s" />
    <circle cx="660" cy="320" r="8" fill="#60a5fa" />

    <circle cx="620" cy="480" r="20" fill="url(#nodeGlow)" class="node" style="animation-delay: 3.2s" />
    <circle cx="620" cy="480" r="6" fill="#38bdf8" />
  </g>
</svg>
