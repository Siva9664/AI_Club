<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="goldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>
    <style>
      @keyframes floatHex {
        0%, 100% { transform: translateY(0px); opacity: 0.7; }
        50% { transform: translateY(-18px); opacity: 1; }
      }
      @keyframes goldRay {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
      .hex-item { animation: floatHex 6s ease-in-out infinite; }
      .laser-gold { stroke-dasharray: 6, 10; animation: goldRay 8s linear infinite; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#0a0704" />

  <!-- Hexagonal Honeycomb Matrix Grid -->
  <g opacity="0.25" stroke="#f59e0b" stroke-width="1" fill="none">
    <polygon points="200,100 240,125 240,175 200,200 160,175 160,125" />
    <polygon points="280,100 320,125 320,175 280,200 240,175 240,125" />
    <polygon points="360,100 400,125 400,175 360,200 320,175 320,125" />
    <polygon points="440,100 480,125 480,175 440,200 400,175 400,125" />
    <polygon points="520,100 560,125 560,175 520,200 480,175 480,125" />
    <polygon points="600,100 640,125 640,175 600,200 560,175 560,125" />

    <polygon points="240,175 280,200 280,250 240,275 200,250 200,200" />
    <polygon points="320,175 360,200 360,250 320,275 280,250 280,200" />
    <polygon points="400,175 440,200 440,250 400,275 360,250 360,200" />
    <polygon points="480,175 520,200 520,250 480,275 440,250 440,200" />
    <polygon points="560,175 600,200 600,250 560,275 520,250 520,200" />

    <polygon points="200,250 240,275 240,325 200,350 160,325 160,275" />
    <polygon points="280,250 320,275 320,325 280,350 240,325 240,275" />
    <polygon points="360,250 400,275 400,325 360,350 320,325 320,275" />
    <polygon points="440,250 480,275 480,325 440,350 400,325 400,275" />
    <polygon points="520,250 560,275 560,325 520,350 480,325 480,275" />
  </g>

  <!-- Glowing Central Achievement Core -->
  <circle cx="400" cy="300" r="140" fill="url(#goldAura)" opacity="0.6" />

  <!-- Shimmering Data Conduits -->
  <g stroke="url(#goldGrad)" stroke-width="2" class="laser-gold" fill="none">
    <path d="M100 480 Q 250 350 400 300 T 700 200" />
    <path d="M120 180 Q 300 260 400 300 T 680 420" />
  </g>

  <!-- Elevated Glowing Hexagons -->
  <g class="hex-item" style="animation-delay: 0s">
    <polygon points="400,250 440,275 440,325 400,350 360,325 360,275" fill="#f59e0b" fill-opacity="0.35" stroke="#fde047" stroke-width="2" />
    <circle cx="400" cy="300" r="8" fill="#ffffff" />
  </g>

  <g class="hex-item" style="animation-delay: 1.5s">
    <polygon points="280,175 320,200 320,250 280,275 240,250 240,200" fill="#ea580c" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="280" cy="225" r="5" fill="#fde047" />
  </g>

  <g class="hex-item" style="animation-delay: 3s">
    <polygon points="520,175 560,200 560,250 520,275 480,250 480,200" fill="#ea580c" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="520" cy="225" r="5" fill="#fde047" />
  </g>
</svg>
