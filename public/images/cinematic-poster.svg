<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Deep Cinematic Cosmic Gradient -->
    <radialGradient id="cinematicGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>

    <!-- Neon Neural Gradients -->
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Dark Space -->
  <rect width="1920" height="1080" fill="url(#cinematicGlow)" />

  <!-- Grid Perspective Overlay -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="180" x2="1920" y2="180" />
    <line x1="0" y1="360" x2="1920" y2="360" />
    <line x1="0" y1="540" x2="1920" y2="540" />
    <line x1="0" y1="720" x2="1920" y2="720" />
    <line x1="0" y1="900" x2="1920" y2="900" />

    <line x1="240" y1="0" x2="240" y2="1080" />
    <line x1="480" y1="0" x2="480" y2="1080" />
    <line x1="720" y1="0" x2="720" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1200" y1="0" x2="1200" y2="1080" />
    <line x1="1440" y1="0" x2="1440" y2="1080" />
    <line x1="1680" y1="0" x2="1680" y2="1080" />
  </g>

  <!-- Large Ambient Lighting Orbs -->
  <circle cx="960" cy="380" r="420" fill="#3b82f6" opacity="0.18" filter="url(#glowFilter)" />
  <circle cx="450" cy="650" r="320" fill="#8b5cf6" opacity="0.15" filter="url(#glowFilter)" />
  <circle cx="1500" cy="450" r="360" fill="#06b6d4" opacity="0.14" filter="url(#glowFilter)" />

  <!-- Neural Constellation Lines & Nodes -->
  <g stroke="url(#neonBlue)" stroke-width="2" opacity="0.6">
    <path d="M 280 400 L 520 280 L 800 350 L 960 220 L 1200 320 L 1480 240 L 1720 420" fill="none" />
    <path d="M 360 680 L 640 520 L 800 350 L 1120 580 L 1380 480 L 1600 680" fill="none" />
    <path d="M 520 280 L 640 520 L 960 700 L 1120 580 L 1480 240" fill="none" />
    <path d="M 800 350 L 960 480 L 1120 580" fill="none" stroke="url(#neonPurple)" stroke-width="2.5" />
  </g>

  <!-- Glowing Synaptic Junctions -->
  <g fill="#38bdf8" filter="url(#glowFilter)">
    <circle cx="280" cy="400" r="7" />
    <circle cx="520" cy="280" r="9" />
    <circle cx="800" cy="350" r="11" />
    <circle cx="960" cy="220" r="12" fill="#60a5fa" />
    <circle cx="1200" cy="320" r="9" />
    <circle cx="1480" cy="240" r="10" />
    <circle cx="1720" cy="420" r="7" />

    <circle cx="360" cy="680" r="8" fill="#c084fc" />
    <circle cx="640" cy="520" r="10" fill="#a855f7" />
    <circle cx="960" cy="480" r="14" fill="#38bdf8" />
    <circle cx="960" cy="700" r="8" />
    <circle cx="1120" cy="580" r="11" fill="#818cf8" />
    <circle cx="1380" cy="480" r="9" />
    <circle cx="1600" cy="680" r="8" fill="#38bdf8" />
  </g>

  <!-- Floating Micro-Particles -->
  <g fill="#e0e7ff" opacity="0.5">
    <circle cx="400" cy="200" r="2" />
    <circle cx="480" cy="450" r="3" />
    <circle cx="680" cy="180" r="2" />
    <circle cx="750" cy="600" r="3" />
    <circle cx="880" cy="280" r="2" />
    <circle cx="1040" cy="360" r="3" />
    <circle cx="1180" cy="190" r="2" />
    <circle cx="1320" cy="420" r="2" />
    <circle cx="1420" cy="620" r="3" />
    <circle cx="1580" cy="310" r="2" />
    <circle cx="1660" cy="550" r="3" />
    <circle cx="960" cy="850" r="2.5" />
    <circle cx="820" cy="780" r="2" />
    <circle cx="1150" cy="800" r="2.5" />
  </g>
</svg>
