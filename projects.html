<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('aiClubProjectsTheme') || localStorage.getItem('ai-club-theme') || localStorage.getItem('aiClubHomeTheme');
        if (!saved) {
          saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | AI Club</title>
  <link rel="icon" type="image/png" href="assets/ai-lab-logo.png">
  <link rel="apple-touch-icon" href="assets/ai-lab-logo.png">

  <!-- Google Fonts: Outfit, JetBrains Mono & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      /* Dark Theme (Default) */
      --achieve-bg-body: #060913;
      --achieve-bg-surface: #0a0f1d;
      --achieve-bg-surface-elevated: #10172c;
      --achieve-bg-card: rgba(16, 24, 44, 0.72);
      --achieve-bg-card-hover: rgba(22, 33, 62, 0.9);
      --achieve-bg-glass: rgba(10, 15, 29, 0.75);
      --achieve-bg-glass-heavy: rgba(8, 12, 24, 0.92);

      --achieve-border-subtle: rgba(255, 255, 255, 0.08);
      --achieve-border-focus: rgba(0, 242, 254, 0.55);
      --achieve-border-glow: rgba(99, 102, 241, 0.4);

      --achieve-text-main: #f8fafc;
      --achieve-text-muted: #94a3b8;
      --achieve-text-dim: #64748b;

      --achieve-cyan: #00f2fe;
      --achieve-blue: #3b82f6;
      --achieve-indigo: #6366f1;
      --achieve-purple: #a855f7;

      --achieve-gradient-brand: linear-gradient(135deg, #00f2fe 0%, #3b82f6 50%, #8b5cf6 100%);
      --achieve-gradient-glow: radial-gradient(circle, rgba(0, 242, 254, 0.16) 0%, rgba(168, 85, 247, 0.08) 45%, transparent 70%);

      --achieve-radius-sm: 8px;
      --achieve-radius-md: 14px;
      --achieve-radius-lg: 20px;
      --achieve-radius-full: 9999px;

      --achieve-font-display: 'Outfit', sans-serif;
      --achieve-font-body: 'Plus Jakarta Sans', sans-serif;
      --achieve-font-mono: 'JetBrains Mono', monospace;

      --achieve-transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --achieve-transition-medium: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="light"] {
      --achieve-bg-body: #f8fafc;
      --achieve-bg-surface: #f1f5f9;
      --achieve-bg-surface-elevated: #e2e8f0;
      --achieve-bg-card: rgba(255, 255, 255, 0.88);
      --achieve-bg-card-hover: rgba(255, 255, 255, 0.98);
      --achieve-bg-glass: rgba(255, 255, 255, 0.82);
      --achieve-bg-glass-heavy: rgba(255, 255, 255, 0.95);

      --achieve-border-subtle: rgba(148, 163, 184, 0.25);
      --achieve-border-focus: rgba(2, 132, 199, 0.6);
      --achieve-border-glow: rgba(99, 102, 241, 0.25);

      --achieve-text-main: #0f172a;
      --achieve-text-muted: #475569;
      --achieve-text-dim: #64748b;

      --achieve-cyan: #0284c7;
      --achieve-blue: #2563eb;
      --achieve-indigo: #4f46e5;
      --achieve-purple: #7c3aed;

      --achieve-gradient-brand: linear-gradient(135deg, #0284c7 0%, #2563eb 50%, #7c3aed 100%);
      --achieve-gradient-glow: radial-gradient(circle, rgba(2, 132, 199, 0.14) 0%, rgba(126, 34, 206, 0.06) 45%, transparent 70%);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100vh;
      background-color: var(--achieve-bg-body);
      color: var(--achieve-text-main);
      font-family: var(--achieve-font-body);
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
    }

    .achieve-container {
      width: 100%;
      max-width: 1280px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 24px;
      padding-right: 24px;
    }

    /* Top Navigation Header */
    .achieve-navbar-wrapper {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      transition: background-color var(--achieve-transition-medium), backdrop-filter var(--achieve-transition-medium), border-color var(--achieve-transition-medium), box-shadow var(--achieve-transition-medium);
      border-bottom: 1px solid transparent;
      background-color: var(--achieve-bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .achieve-navbar-wrapper.scrolled {
      border-bottom: 1px solid var(--achieve-border-subtle);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
    }

    .achieve-nav-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 76px;
    }

    .achieve-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--achieve-font-display);
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      position: relative;
    }

    .achieve-brand-logo-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(10, 15, 29, 0.8);
      border: 2px solid rgba(0, 242, 254, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(0, 242, 254, 0.35);
      overflow: hidden;
      flex-shrink: 0;
      transition: transform var(--achieve-transition-fast), border-color var(--achieve-transition-fast), box-shadow var(--achieve-transition-fast);
    }

    .achieve-brand:hover .achieve-brand-logo-icon {
      transform: scale(1.08) rotate(3deg);
      border-color: var(--achieve-cyan);
      box-shadow: 0 0 24px rgba(0, 242, 254, 0.6), 0 0 40px rgba(99, 102, 241, 0.35);
    }

    .achieve-brand-logo-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .achieve-brand-text {
      display: flex;
      flex-direction: column;
    }

    .achieve-brand-name {
      background: var(--achieve-gradient-brand);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .achieve-brand-sub {
      font-size: 0.65rem;
      font-family: var(--achieve-font-mono);
      color: var(--achieve-text-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .achieve-nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      list-style: none;
    }

    .achieve-nav-item {
      position: relative;
    }

    .achieve-nav-link {
      padding: 8px 16px;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--achieve-text-muted);
      border-radius: var(--achieve-radius-sm);
      display: inline-flex;
      align-items: center;
      position: relative;
      transition: color var(--achieve-transition-fast), background-color var(--achieve-transition-fast), transform var(--achieve-transition-fast);
    }

    .achieve-nav-link:hover {
      color: var(--achieve-text-main);
      background: rgba(255, 255, 255, 0.04);
    }

    [data-theme="light"] .achieve-nav-link:hover {
      background: rgba(0, 0, 0, 0.04);
    }

    .achieve-nav-link.active {
      color: var(--achieve-cyan);
      font-weight: 600;
      background: rgba(0, 242, 254, 0.08);
      border: 1px solid rgba(0, 242, 254, 0.25);
    }

    .achieve-nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 2px;
      background: var(--achieve-cyan);
      border-radius: var(--achieve-radius-full);
      box-shadow: 0 0 8px var(--achieve-cyan);
    }

    .achieve-nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .achieve-theme-toggle {
      width: 42px;
      height: 42px;
      border-radius: var(--achieve-radius-md);
      background: var(--achieve-bg-card);
      border: 1px solid var(--achieve-border-subtle);
      color: var(--achieve-text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color var(--achieve-transition-fast), transform var(--achieve-transition-fast), box-shadow var(--achieve-transition-fast);
    }

    .achieve-theme-toggle:hover {
      border-color: var(--achieve-border-focus);
      box-shadow: 0 0 16px rgba(0, 242, 254, 0.2);
      transform: translateY(-2px);
    }

    .achieve-theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform var(--achieve-transition-medium);
    }

    .achieve-login-btn {
      padding: 10px 20px;
      font-size: 0.875rem;
      font-weight: 600;
      color: #ffffff;
      background: var(--achieve-gradient-brand);
      border-radius: var(--achieve-radius-md);
      box-shadow: 0 4px 16px rgba(0, 242, 254, 0.25);
      transition: transform var(--achieve-transition-fast), box-shadow var(--achieve-transition-fast), filter var(--achieve-transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .achieve-login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(0, 242, 254, 0.4);
      filter: brightness(1.08);
    }

    /* Ambient background subtle lighting */
    .cyber-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle at 50% 15%, rgba(0, 242, 254, 0.07) 0%, rgba(139, 92, 246, 0.03) 45%, transparent 75%);
    }

    @media (max-width: 900px) {
      .achieve-nav-links {
        gap: 4px;
      }
      .achieve-nav-link {
        padding: 6px 10px;
        font-size: 0.82rem;
      }
    }

    @media (max-width: 680px) {
      .achieve-nav-content {
        padding: 0;
      }
      .achieve-brand-text {
        display: none;
      }
      .achieve-nav-link {
        padding: 5px 6px;
        font-size: 0.78rem;
      }
      .achieve-login-btn {
        padding: 6px 12px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>

<body>
  <div class="cyber-backdrop"></div>

  <!-- Top Navigation Click Bar Alone -->
  <header class="achieve-navbar-wrapper" id="achieve-navbar">
    <div class="achieve-container">
      <div class="achieve-nav-content">

        <!-- Logo / Name -->
        <a href="index.html" class="achieve-brand" aria-label="AI Lab Home">
          <div class="achieve-brand-logo-icon">
            <img src="assets/ai-lab-logo.png" alt="AI LAB Official Logo" class="achieve-brand-logo-img" width="46" height="46" loading="eager" />
          </div>
          <div class="achieve-brand-text">
            <span class="achieve-brand-name">AI LAB</span>
            <span class="achieve-brand-sub">STUDENT CHAPTER</span>
          </div>
        </a>

        <!-- Desktop Navigation Links: Home, Project (Active), Achievements, Visitors, Chat -->
        <nav aria-label="Main Navigation">
          <ul class="achieve-nav-links">
            <li class="achieve-nav-item"><a href="index.html" class="achieve-nav-link">Home</a></li>
            <li class="achieve-nav-item"><a href="projects.html" class="achieve-nav-link active" aria-current="page">Project</a></li>
            <li class="achieve-nav-item"><a href="achievement.html" class="achieve-nav-link">Achievements</a></li>
            <li class="achieve-nav-item"><a href="visitors.html" class="achieve-nav-link">Visitors</a></li>
            <li class="achieve-nav-item"><a href="chat.html" class="achieve-nav-link" id="achieve-chat-link">Chat</a></li>
          </ul>
        </nav>

        <!-- Right Side Nav Actions -->
        <div class="achieve-nav-actions">
          <button class="achieve-theme-toggle" id="achieve-theme-toggle-btn"
            aria-label="Toggle dark or light theme">
            <svg id="achieve-theme-icon" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>

          <a href="#login" class="achieve-login-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            <span>Login</span>
          </a>
        </div>

      </div>
    </div>
  </header>

  <script>
    (function () {
      // Navbar scroll effect
      const navbar = document.getElementById('achieve-navbar');
      window.addEventListener('scroll', () => {
        if (window.scrollY > 20) {
          navbar.classList.add('scrolled');
        } else {
          navbar.classList.remove('scrolled');
        }
      }, { passive: true });

      // Theme toggle logic
      const themeToggleBtn = document.getElementById('achieve-theme-toggle-btn');
      const themeIcon = document.getElementById('achieve-theme-icon');

      function updateThemeIcon(theme) {
        if (!themeIcon) return;
        if (theme === 'light') {
          // Moon icon
          themeIcon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
        } else {
          // Sun icon
          themeIcon.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
        }
      }

      const initialTheme = document.documentElement.getAttribute('data-theme') || 'dark';
      updateThemeIcon(initialTheme);

      if (themeToggleBtn) {
        themeToggleBtn.addEventListener('click', () => {
          const current = document.documentElement.getAttribute('data-theme') || 'dark';
          const next = current === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          try {
            localStorage.setItem('ai-club-theme', next);
            localStorage.setItem('aiClubProjectsTheme', next);
            localStorage.setItem('aiClubHomeTheme', next);
          } catch (e) {}
          updateThemeIcon(next);
        });
      }
    })();
  </script>
</body>
</html>
